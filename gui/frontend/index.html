<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkIt — ABC Price Updater</title>
  <meta name="description" content="Update product prices using Stock and IMF data." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ================================================================
       SCREEN: Form
  ================================================================ -->
  <div id="screen-form" class="screen active">
    <div class="shell">

      <header class="app-header">
        <img src="assets/logo.png" alt="LinkIt Logo" class="logo" />
        <h1 class="app-title">ABC Price Updater</h1>
        <p class="app-subtitle">Update product prices using Stock and IMF data</p>
      </header>

      <form id="main-form" class="form" novalidate>

        <!-- Organization Name -->
        <div class="field" id="field-orgName">
          <label class="label" for="orgName">Organization Name</label>
          <input
            id="orgName"
            class="input"
            type="text"
            placeholder="Enter organization name"
            autocomplete="off"
            spellcheck="false"
          />
          <span class="field-error" id="error-orgName" aria-live="polite"></span>
        </div>

        <!-- Output Directory -->
        <div class="field" id="field-outputDir">
          <label class="label" for="outputDir">Output Directory</label>
          <div class="file-row">
            <input
              id="outputDir"
              class="input file-input"
              type="text"
              placeholder="Select output directory"
              readonly
              tabindex="-1"
            />
            <button type="button" id="btn-outputDir" class="browse-btn" aria-label="Browse output directory">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            </button>
          </div>
          <span class="field-error" id="error-outputDir" aria-live="polite"></span>
        </div>

        <!-- IMF File -->
        <div class="field" id="field-imfFile">
          <label class="label" for="imfFile">IMF File</label>
          <div class="file-row">
            <input
              id="imfFile"
              class="input file-input"
              type="text"
              placeholder="Select IMF Excel file (.xlsx, .xls)"
              readonly
              tabindex="-1"
            />
            <button type="button" id="btn-imfFile" class="browse-btn" aria-label="Browse IMF file">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </button>
          </div>
          <span class="field-error" id="error-imfFile" aria-live="polite"></span>
        </div>

        <!-- Stock File -->
        <div class="field" id="field-stockFile">
          <label class="label" for="stockFile">Stock File</label>
          <div class="file-row">
            <input
              id="stockFile"
              class="input file-input"
              type="text"
              placeholder="Select Stock Excel file (.xlsx, .xls)"
              readonly
              tabindex="-1"
            />
            <button type="button" id="btn-stockFile" class="browse-btn" aria-label="Browse Stock file">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </button>
          </div>
          <span class="field-error" id="error-stockFile" aria-live="polite"></span>
        </div>

        <button type="submit" id="btn-process" class="btn-primary">
          Process Files
        </button>

      </form>
    </div>
  </div>

  <!-- ================================================================
       SCREEN: Processing
  ================================================================ -->
  <div id="screen-processing" class="screen">
    <div class="shell centered">
      <div class="spinner" aria-label="Processing"></div>
      <p class="processing-label">Processing files&hellip;</p>
      <p class="processing-hint">Reading and matching product data</p>
    </div>
  </div>

  <!-- ================================================================
       SCREEN: Results
  ================================================================ -->
  <div id="screen-results" class="screen">
    <div class="shell">

      <div class="result-hero">
        <div class="result-icon success-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2 class="result-heading">Complete</h2>
        <p class="result-subheading">Your price updates were generated successfully.</p>
      </div>

      <div class="stats-grid" id="stats-grid">
        <!-- Populated by JS -->
      </div>

      <div class="reports-section">
        <h3 class="reports-heading">Generated Reports</h3>
        <ul class="reports-list" id="reports-list">
          <!-- Populated by JS -->
        </ul>
      </div>

      <div class="result-actions">
        <button type="button" id="btn-open-folder" class="btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Open Output Folder
        </button>
        <button type="button" id="btn-process-another" class="btn-ghost">
          Process Another Set
        </button>
      </div>

    </div>
  </div>

  <!-- ================================================================
       SCREEN: Error
  ================================================================ -->
  <div id="screen-error" class="screen">
    <div class="shell centered">
      <div class="result-icon error-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <h2 class="result-heading">Processing Failed</h2>
      <p class="error-message" id="error-detail"></p>
      <button type="button" id="btn-error-back" class="btn-ghost">
        ← Back to Form
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
